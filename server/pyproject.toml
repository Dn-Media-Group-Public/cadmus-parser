[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadmus-parser-server"
version = "0.1.0"
description = "cadmus-parser service side: the wrapper (storage <-> parser, uid pool), the worker and the default `files` processor"
requires-python = ">=3.11"
dependencies = ["starlette", "uvicorn[standard]", "fsspec"]

[project.optional-dependencies]
# the store the deployment uses (see sdk/pyproject.toml for why gcsfs is a separate pip step in the images)
s3 = ["s3fs[boto3]>=2024.1"]
gcs = ["gcsfs", "google-auth"]
# the default `files` processor (markitdown, trafilatura, archives, decoders, metadata, OCR); without it no processor is installed
files = ["trafilatura", "markitdown[all]", "python-multipart", "lxml_html_clean", "markdown-it-py", "linkify-it-py", "msgpack", "cbor2", "bson",
         "py7zr", "rarfile", "blackboxprotobuf", "pyyaml", "rasterio", "pyogrio", "lxml", "pypdf", "pytesseract", "pypdfium2", "Pillow", "pillow-heif", "python-magic"]
test = ["pytest", "httpx"]

[project.entry-points."cadmus_parser.processors"]
metadata = "cadmus_parser_server.parse:Metadata"
sizecap = "cadmus_parser_server.parse:SizeCap"
archives = "cadmus_parser_server.parse:Archives"
markdown = "cadmus_parser_server.parse:Markdown"
binary = "cadmus_parser_server.parse:Binary"
apk = "cadmus_parser_server.parse:Apk"
html = "cadmus_parser_server.parse:Html"
documents = "cadmus_parser_server.parse:Documents"
members = "cadmus_parser_server.parse:Members"
media-decode = "cadmus_parser_server.media_decode:MediaDecode"
frame-ocr = "cadmus_parser_server.frame_ocr:FrameOcr"
asr-split = "cadmus_parser_server.asr:AsrSplit"
asr-primary = "cadmus_parser_server.asr:AsrPrimary"
asr-fallback = "cadmus_parser_server.asr:AsrFallback"
asr-degrade = "cadmus_parser_server.asr:AsrDegrade"
caption-split = "cadmus_parser_server.caption:CaptionSplit"
caption-primary = "cadmus_parser_server.caption:CaptionPrimary"
caption-fallback = "cadmus_parser_server.caption:CaptionFallback"
caption-skip = "cadmus_parser_server.caption:CaptionSkip"
media-markdown = "cadmus_parser_server.media_markdown:MediaMarkdown"

[tool.setuptools.packages.find]
include = ["cadmus_parser_server*"]
