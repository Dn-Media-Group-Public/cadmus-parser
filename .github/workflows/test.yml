name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl ffmpeg
      - run: pip install ./server[s3,test] ./client[test] pytest-asyncio httpx starlette uvicorn
      - run: for d in server client blob-sidecar ocr-sidecar; do python -m pytest -q $d || exit 1; done
