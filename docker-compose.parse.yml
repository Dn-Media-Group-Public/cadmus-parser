# The parser service as a library (docs/reference.md): what interprets an untrusted file runs here, not in the client. `parser` = the wrapper
# (storage <-> parser, holds the tokens) plus sandboxed parser processes on pool uids that can read nothing, reach nothing and authenticate to
# nothing; `blob-sidecar` = the authenticated egress proxy the wrapper reaches the store through (the parser has no route out: its networks are
# internal). Deploy with `docker stack deploy -c docker-compose.parse.yml -c <overlay> ...`; `python -m cadmus_parser_server.overlay` writes
# the overlay: a `<client>-parse` network per client service (the client and the parser on it), PARSE_URL/PARSE_TOKEN in each client,
# the dev store's network for the proxy, your image for `parser` and the `ocr-sidecar` / `asr-sidecar` / `caption-sidecar` when configured.
version: "3.8"

services:
  parser:
    image: ${IMAGE_PREFIX:-}cadmus-parser:${IMAGE_TAG:-local}   # the ready-made image (default processors); the overlay replaces it with your own
    # The wrapper keeps exactly what the uid lifecycle needs (server/entrypoint.sh drops the rest and sets no_new_privs); SETPCAP is for that drop.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL, SETPCAP]
    deploy:
      replicas: ${PARSE_REPLICAS:-1}   # each replica has its own uid pool and answers 503 when full; any replica answers status reads
      restart_policy: { condition: any }
      resources:
        limits:
          memory: ${PARSE_MEMORY:-8g}
    environment:
      WRAPPER_TOKEN: ${WRAPPER_TOKEN}
      PROXY_TOKEN: ${PROXY_TOKEN}
      PARSE_PROXY_HOST: blob-sidecar:3128
      PARSE_BLOB_OPTIONS: ${PARSE_BLOB_OPTIONS:-}   # fsspec options merged under every job's own credentials (endpoint ...), no secrets: the credentials come with each POST
      OCR_PROFILES: ${PARSE_OCR_TABLE:-}            # name -> {url, token}: the wrapper hands a parser only the profile its job asked for
      ASR_PROFILES: ${PARSE_ASR_TABLE:-}            # same for `features.asr`, and for the fallback model `features.asr-fallback`
      ASR_FALLBACK_PROFILES: ${PARSE_ASR_FALLBACK_TABLE:-}
      CAPTION_PROFILES: ${PARSE_CAPTION_TABLE:-}    # same for `features.caption`, and for the fallback model `features.caption-fallback`
      CAPTION_FALLBACK_PROFILES: ${PARSE_CAPTION_FALLBACK_TABLE:-}
      PARSE_POOL_SIZE: ${PARSE_POOL_SIZE:-4}
      PARSE_LIMITS: ${PARSE_LIMITS:-}               # per media class, see docs/reference.md; every built-in default is finite
      PARSE_PASS_ENV: ${PARSE_PASS_ENV:-}             # names of further variables the parser process is to see (processor settings, no secrets)
      PARSE_TRACEBACKS: ${PARSE_TRACEBACKS:-}         # 1: unexpected failures carry a traceback in status.json and error bodies
      # settings of the default `files` processor, forwarded to the parser when set (the code has the defaults)
      MAX_PARSE_BYTES: ${MAX_PARSE_BYTES:-}
      MAX_ARCHIVE_BYTES: ${MAX_ARCHIVE_BYTES:-}
      MAX_ARCHIVE_MEMBERS: ${MAX_ARCHIVE_MEMBERS:-}
      METADATA_TIMEOUT: ${METADATA_TIMEOUT:-}
      METADATA_MAX_MEM: ${METADATA_MAX_MEM:-}
      METADATA_MAX_BYTES: ${METADATA_MAX_BYTES:-}
      OCR_TIMEOUT: ${OCR_TIMEOUT:-}
      ASR_TIMEOUT: ${ASR_TIMEOUT:-}
      CAPTION_TIMEOUT: ${CAPTION_TIMEOUT:-}
      REPLICA_ID: "{{.Task.Slot}}"
    networks: [parse-egress, parse-ocr, parse-asr, parse-caption]

  blob-sidecar:
    image: ${IMAGE_PREFIX:-}cadmus-parser-blob-sidecar:${IMAGE_TAG:-local}   # blob-sidecar/Dockerfile (context: this repo's root): squid 6, own egress rules
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP, KILL]   # NET_ADMIN for the egress rules only, dropped before squid starts; KILL: tini (root) signals squid (uid proxy) on stop
    deploy: { replicas: 1, restart_policy: { condition: any } }
    environment:
      PROXY_TOKEN: ${PROXY_TOKEN}
      PARSE_PROXY_ALLOW: ${PARSE_PROXY_ALLOW:-}   # host:port exceptions to "public internet only": the dev store (deploy.sh sets seaweedfs:8333)
    networks: [parse-egress, public]   # public: the way out (the egress rules keep it off every private range)

networks:
  public: { driver: overlay }                        # the way out of the proxy (the same definition may be in the client's stack file)
  parse-egress: { driver: overlay, internal: true }   # parser <-> proxy: no route out
  parse-ocr: { driver: overlay, internal: true }      # parser <-> ocr-sidecar
  parse-asr: { driver: overlay, internal: true }      # parser <-> asr-sidecar
  parse-caption: { driver: overlay, internal: true }  # parser <-> caption-sidecar
